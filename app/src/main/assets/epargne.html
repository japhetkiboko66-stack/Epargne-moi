<!DOCTYPE html>
<html lang="fr" data-theme="blue" data-icon-style="glass">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vela Épargne" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="theme-color" content="#050b1f" id="meta-theme-color" />
  <title>Vela Épargne</title>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 12px);
      --safe-bottom: env(safe-area-inset-bottom, 16px);

      --bg-0: #050b1f;
      --bg-1: #091334;
      --accent-1: #3b82f6;
      --accent-2: #22d3ee;
      --accent-grad: linear-gradient(135deg, #3b82f6 0%, #22d3ee 100%);
      --glow-1: rgba(59, 130, 246, 0.25);
      --glow-2: rgba(34, 211, 238, 0.16);

      /* Cartes dashboard plus sombres que celles des autres pages */
      --card-dash: linear-gradient(155deg, rgba(6, 12, 34, 0.94) 0%, rgba(10, 20, 50, 0.82) 100%);
      --card-dash-strong: linear-gradient(155deg, rgba(4, 9, 26, 0.97) 0%, rgba(10, 22, 56, 0.88) 100%);
      --card-page: linear-gradient(155deg, rgba(22, 37, 82, 0.56) 0%, rgba(13, 24, 58, 0.44) 100%);
      --card-border: rgba(255, 255, 255, 0.10);
      --card-border-bright: rgba(255, 255, 255, 0.18);

      /* Glass secondary buttons & icon squircles */
      --glass-btn-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.04));
      --glass-btn-border: rgba(255, 255, 255, 0.20);
      --icon-box-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.03) 100%);
      --icon-box-border: rgba(255, 255, 255, 0.22);
      --icon-stroke: rgba(248, 250, 252, 0.94);

      --text-1: #f8fafc;
      --text-2: rgba(226, 232, 240, 0.72);
      --text-3: rgba(148, 163, 184, 0.65);

      --ok: #34d399;
      --warn: #fbbf24;
      --bad: #fb7185;

      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 14px;
      --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
    }

    html[data-theme="orange"] {
      --bg-0: #130904;
      --bg-1: #241208;
      --accent-1: #f97316;
      --accent-2: #fbbf24;
      --accent-grad: linear-gradient(135deg, #f97316 0%, #fbbf24 100%);
      --glow-1: rgba(249, 115, 22, 0.24);
      --glow-2: rgba(251, 191, 36, 0.15);
      --card-dash: linear-gradient(155deg, rgba(21, 10, 5, 0.94) 0%, rgba(34, 17, 8, 0.82) 100%);
      --card-dash-strong: linear-gradient(155deg, rgba(16, 8, 4, 0.97) 0%, rgba(38, 18, 8, 0.88) 100%);
      --card-page: linear-gradient(155deg, rgba(60, 30, 14, 0.56) 0%, rgba(36, 18, 9, 0.44) 100%);
    }

    html[data-theme="green"] {
      --bg-0: #04130d;
      --bg-1: #082318;
      --accent-1: #10b981;
      --accent-2: #34d399;
      --accent-grad: linear-gradient(135deg, #10b981 0%, #34d399 100%);
      --glow-1: rgba(16, 185, 129, 0.23);
      --glow-2: rgba(52, 211, 153, 0.14);
      --card-dash: linear-gradient(155deg, rgba(4, 19, 13, 0.94) 0%, rgba(8, 30, 21, 0.82) 100%);
      --card-dash-strong: linear-gradient(155deg, rgba(3, 15, 10, 0.97) 0%, rgba(9, 34, 24, 0.88) 100%);
      --card-page: linear-gradient(155deg, rgba(16, 56, 40, 0.56) 0%, rgba(10, 36, 26, 0.44) 100%);
    }

    html[data-icon-style="accent"] {
      --icon-box-bg: linear-gradient(145deg, color-mix(in srgb, var(--accent-1) 28%, rgba(255,255,255,0.06)), color-mix(in srgb, var(--accent-2) 8%, rgba(255,255,255,0.02)));
      --icon-box-border: color-mix(in srgb, var(--accent-2) 40%, rgba(255,255,255,0.16));
      --icon-stroke: var(--accent-2);
    }

    html[data-icon-style="silver"] {
      --icon-box-bg: linear-gradient(145deg, rgba(226, 232, 240, 0.16), rgba(148, 163, 184, 0.04));
      --icon-box-border: rgba(226, 232, 240, 0.28);
      --icon-stroke: #e2e8f0;
    }

    html[data-icon-style="frost"] {
      --icon-box-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.06));
      --icon-box-border: rgba(255, 255, 255, 0.36);
      --icon-stroke: #ffffff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-0);
      color: var(--text-1);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.4;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    input, textarea, select {
      user-select: text;
      font-family: inherit;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    /* Ambient iOS 2026 background */
    .app-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(120% 70% at 12% -5%, var(--glow-1), transparent 58%),
        radial-gradient(95% 65% at 92% 18%, var(--glow-2), transparent 55%),
        radial-gradient(110% 70% at 50% 105%, var(--glow-1), transparent 62%),
        linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 55%, var(--bg-0) 100%);
      transition: background 0.5s ease;
      pointer-events: none;
    }

    .app-shell {
      position: relative;
      z-index: 1;
      height: 100%;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    /* Top Header */
    .top-bar {
      padding: calc(var(--safe-top) + 8px) 18px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: var(--icon-box-bg);
      border: 1px solid var(--icon-box-border);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 8px 20px rgba(0,0,0,0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 11.5px;
      color: var(--text-3);
      font-weight: 500;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Glass secondary buttons */
    .glass-btn {
      background: var(--glass-btn-bg);
      border: 1px solid var(--glass-btn-border);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 6px 18px rgba(0,0,0,0.22);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      color: var(--text-1);
      border-radius: 14px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      transition: transform 0.16s var(--ease-spring), background 0.2s ease, border-color 0.2s ease;
    }

    .glass-btn:active {
      transform: scale(0.96);
    }

    .glass-icon-btn {
      width: 38px;
      height: 38px;
      padding: 0;
      border-radius: 13px;
    }

    .primary-btn {
      background: var(--accent-grad);
      border: 1px solid rgba(255,255,255,0.28);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 10px 24px var(--glow-1);
      color: #ffffff;
      border-radius: 15px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.16s var(--ease-spring), filter 0.2s ease;
    }

    .primary-btn:active {
      transform: scale(0.96);
    }

    .danger-btn {
      background: linear-gradient(145deg, rgba(251, 113, 133, 0.24), rgba(225, 29, 72, 0.14));
      border: 1px solid rgba(251, 113, 133, 0.35);
      color: #fecdd3;
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Main viewport & sliding pages */
    .pages-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .page {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 6px 16px calc(108px + var(--safe-bottom));
      opacity: 0;
      pointer-events: none;
      transform: translateX(28px);
      transition: transform 0.34s var(--ease-spring), opacity 0.26s ease;
      scrollbar-width: none;
    }

    .page::-webkit-scrollbar { display: none; }

    .page.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }

    .page.exit-left {
      opacity: 0;
      transform: translateX(-28px);
    }

    .page.exit-right {
      opacity: 0;
      transform: translateX(28px);
    }

    /* Cards */
    .card {
      border-radius: var(--radius-lg);
      border: 1px solid var(--card-border);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 14px 32px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
      padding: 16px;
      position: relative;
      overflow: hidden;
    }

    .page-dashboard .card {
      background: var(--card-dash);
    }

    .page-sub .card {
      background: var(--card-page);
    }

    /* Glass Icon Squircle */
    .icon-squircle {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      background: var(--icon-box-bg);
      border: 1px solid var(--icon-box-border);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.24), 0 8px 18px rgba(0,0,0,0.22);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      position: relative;
    }

    .icon-squircle.sm {
      width: 36px;
      height: 36px;
      border-radius: 12px;
    }

    .icon-squircle.lg {
      width: 54px;
      height: 54px;
      border-radius: 18px;
    }

    svg.ico {
      width: 22px;
      height: 22px;
      stroke: var(--icon-stroke);
      stroke-width: 1.7;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: block;
    }

    .icon-squircle.sm svg.ico { width: 18px; height: 18px; }
    .icon-squircle.lg svg.ico { width: 25px; height: 25px; }

    /* Balance Hero Card (Dashboard) */
    .balance-card {
      background: var(--card-dash-strong) !important;
      padding: 20px 18px 18px;
      border-color: var(--card-border-bright);
      margin-bottom: 14px;
    }

    .balance-aura {
      position: absolute;
      right: -30px;
      top: -40px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow-1) 0%, transparent 70%);
      pointer-events: none;
    }

    .balance-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    .balance-amount {
      font-size: clamp(28px, 7.6vw, 38px);
      font-weight: 780;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(180deg, #ffffff 10%, rgba(226, 232, 240, 0.78) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      word-break: break-word;
    }

    .balance-subline {
      margin-top: 8px;
      font-size: 12.5px;
      color: var(--text-2);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      position: relative;
      z-index: 1;
    }

    /* Segmented Pill Switch */
    .curr-switch {
      display: inline-flex;
      padding: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(12px);
      flex-shrink: 0;
    }

    .curr-switch button {
      border: none;
      background: transparent;
      color: var(--text-2);
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .curr-switch button.active {
      background: var(--accent-grad);
      color: #ffffff;
      box-shadow: 0 3px 10px var(--glow-1);
    }

    /* Dashboard Bento Grid: 3 Goals + Countdown left | 2 Revenue squares right */
    .dash-bento {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
      align-items: stretch;
    }

    .dash-bento-left {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dash-bento-right {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .mini-label {
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-3);
    }

    .goals-mini-card {
      padding: 13px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .goals-ring-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .goal-mini-item {
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      padding: 4px;
      border-radius: 12px;
      transition: background 0.15s ease;
    }

    .goal-mini-item:active {
      background: rgba(255,255,255,0.06);
    }

    .goal-mini-info {
      min-width: 0;
      flex: 1;
    }

    .goal-mini-name {
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .goal-mini-sub {
      font-size: 11px;
      color: var(--text-3);
    }

    .countdown-pill {
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .countdown-val {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--accent-2);
      letter-spacing: 0.01em;
    }

    .rev-square {
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.16s var(--ease-spring);
    }

    .rev-square:active { transform: scale(0.98); }

    .rev-square-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .rev-amount {
      font-size: 18px;
      font-weight: 750;
      margin-top: 8px;
      letter-spacing: -0.02em;
    }

    .rev-eq {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 2px;
    }

    /* Enriched Visual Flow Bar on Dashboard */
    .flow-visual-card {
      padding: 14px 16px;
      margin-bottom: 14px;
    }

    .flow-bar-track {
      height: 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      overflow: hidden;
      display: flex;
      gap: 2px;
      margin: 10px 0 10px;
    }

    .flow-seg {
      height: 100%;
      border-radius: 999px;
      transition: width 0.6s var(--ease-spring);
    }

    .flow-legend {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .flow-leg-item {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .flow-leg-dot {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--text-3);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }

    /* 4 Quick Squares on Dashboard */
    .quick-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .quick-sq {
      background: var(--card-dash);
      border: 1px solid var(--card-border);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), 0 10px 22px rgba(0,0,0,0.28);
      border-radius: 20px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.16s var(--ease-spring), border-color 0.2s ease;
    }

    .quick-sq:active {
      transform: scale(0.95);
    }

    .quick-sq span {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-2);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    /* Section header */
    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 6px 2px 10px;
    }

    .sec-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    /* Widgets Grid */
    .widgets-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-auto-rows: minmax(126px, auto);
      gap: 12px;
      margin-bottom: 18px;
    }

    .widget-card {
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .widget-card.size-square { grid-column: span 1; }
    .widget-card.size-wide { grid-column: span 2; }
    .widget-card.size-large { grid-column: span 2; min-height: 210px; }

    .widget-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .widget-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .widget-title {
      font-size: 12.5px;
      font-weight: 650;
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .widget-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tiny-btn {
      width: 26px;
      height: 26px;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: var(--text-2);
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 11px;
    }

    .tiny-btn svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
    }

    .widget-val {
      font-size: 20px;
      font-weight: 760;
      letter-spacing: -0.02em;
    }

    .widget-sub {
      font-size: 11px;
      color: var(--text-3);
    }

    /* Horizontal Objets strip */
    .h-strip {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 6px;
      scrollbar-width: none;
    }

    .h-strip::-webkit-scrollbar { display: none; }

    .strip-card {
      flex: 0 0 228px;
      scroll-snap-align: start;
      padding: 13px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .strip-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Circular SVG Gauge */
    .ring-wrap {
      position: relative;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .ring-wrap svg {
      transform: rotate(-90deg);
    }

    .ring-track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.09);
    }

    .ring-fill {
      fill: none;
      stroke: url(#accentGradDef);
      stroke-linecap: round;
      transition: stroke-dashoffset 0.75s var(--ease-spring);
    }

    .ring-pct {
      position: absolute;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-1);
    }

    /* Avatar circle for Objets */
    .obj-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--icon-box-bg);
      border: 1px solid var(--icon-box-border);
      display: grid;
      place-items: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .obj-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Subpages Segmented Tabs */
    .seg-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 4px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.10);
      margin-bottom: 14px;
    }

    .seg-tabs::-webkit-scrollbar { display: none; }

    .seg-tab {
      flex: 1 0 auto;
      border: none;
      background: transparent;
      color: var(--text-2);
      font-size: 12.5px;
      font-weight: 650;
      padding: 9px 13px;
      border-radius: 13px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .seg-tab.active {
      background: var(--accent-grad);
      color: #ffffff;
      box-shadow: 0 6px 16px var(--glow-1);
    }

    /* List Items */
    .list-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row-card {
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.14s var(--ease-spring);
    }

    .row-card:active {
      transform: scale(0.985);
    }

    .row-main {
      flex: 1;
      min-width: 0;
    }

    .row-title {
      font-size: 14.5px;
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-meta {
      font-size: 12px;
      color: var(--text-3);
      margin-top: 2px;
    }

    .row-right {
      text-align: right;
      flex-shrink: 0;
    }

    .row-amount {
      font-size: 15px;
      font-weight: 720;
    }

    .row-eq {
      font-size: 11px;
      color: var(--text-3);
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 650;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      color: var(--text-2);
    }

    .badge.ok { background: rgba(52, 211, 153, 0.14); border-color: rgba(52, 211, 153, 0.32); color: #6ee7b7; }
    .badge.warn { background: rgba(251, 191, 36, 0.14); border-color: rgba(251, 191, 36, 0.34); color: #fde68a; }
    .badge.bad { background: rgba(251, 113, 133, 0.16); border-color: rgba(251, 113, 133, 0.36); color: #fecdd3; }

    /* Bottom Floating Glass Navigation + Floating '+' */
    .bottom-dock {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(var(--safe-bottom) + 10px);
      width: min(calc(100% - 24px), 496px);
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }

    .nav-capsule {
      flex: 1;
      pointer-events: auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      padding: 6px 6px;
      border-radius: 28px;
      background: linear-gradient(155deg, rgba(16, 24, 52, 0.72), rgba(8, 13, 30, 0.84));
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 18px 40px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(26px) saturate(180%);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
    }

    html[data-theme="orange"] .nav-capsule {
      background: linear-gradient(155deg, rgba(42, 20, 10, 0.76), rgba(20, 9, 4, 0.86));
    }

    html[data-theme="green"] .nav-capsule {
      background: linear-gradient(155deg, rgba(10, 36, 26, 0.76), rgba(4, 17, 12, 0.86));
    }

    .nav-item {
      border: none;
      background: transparent;
      color: var(--text-3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 7px 2px;
      border-radius: 20px;
      cursor: pointer;
      transition: color 0.2s ease, background 0.22s ease, transform 0.16s var(--ease-spring);
      min-height: 48px;
    }

    .nav-item svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.22s var(--ease-spring);
    }

    .nav-item span {
      font-size: 10px;
      font-weight: 650;
      letter-spacing: 0.01em;
    }

    .nav-item.active {
      color: #ffffff;
      background: linear-gradient(145deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.22);
    }

    .nav-item.active svg {
      transform: translateY(-1px) scale(1.06);
      stroke: var(--accent-2);
    }

    .fab-plus {
      pointer-events: auto;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.28);
      background: var(--accent-grad);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 14px 30px var(--glow-1);
      color: #ffffff;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.2s var(--ease-spring);
    }

    .fab-plus:active {
      transform: scale(0.92) rotate(45deg);
    }

    .fab-plus svg {
      width: 25px;
      height: 25px;
      stroke: #ffffff;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
    }

    /* Bottom Sheets / Modals */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(2, 6, 18, 0.62);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.24s ease;
    }

    .sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      background: linear-gradient(165deg, rgba(16, 26, 58, 0.94), rgba(7, 12, 30, 0.98));
      border-top: 1px solid rgba(255,255,255,0.20);
      border-left: 1px solid rgba(255,255,255,0.10);
      border-right: 1px solid rgba(255,255,255,0.10);
      border-radius: 28px 28px 0 0;
      padding: 12px 18px calc(24px + var(--safe-bottom));
      box-shadow: 0 -20px 50px rgba(0,0,0,0.65);
      transform: translateY(100%);
      transition: transform 0.34s var(--ease-spring);
    }

    html[data-theme="orange"] .sheet {
      background: linear-gradient(165deg, rgba(42, 20, 10, 0.95), rgba(18, 8, 4, 0.98));
    }

    html[data-theme="green"] .sheet {
      background: linear-gradient(165deg, rgba(10, 38, 27, 0.95), rgba(4, 18, 12, 0.98));
    }

    .sheet-backdrop.open .sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 42px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,0.26);
      margin: 0 auto 14px;
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }

    .sheet-title {
      font-size: 18px;
      font-weight: 750;
      letter-spacing: -0.02em;
    }

    /* Quick Add Grid (10 items) */
    .qa-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .qa-tile {
      background: var(--glass-btn-bg);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 20px;
      padding: 14px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      transition: transform 0.15s var(--ease-spring);
    }

    .qa-tile:active { transform: scale(0.95); }

    .qa-tile span {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-1);
      text-align: center;
    }

    /* Forms */
    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 650;
      color: var(--text-2);
      margin-bottom: 6px;
    }

    .input, select.input, textarea.input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 12px 13px;
      color: var(--text-1);
      font-size: 14.5px;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .input:focus {
      border-color: var(--accent-2);
      background: rgba(255, 255, 255, 0.09);
    }

    .amount-input-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .amount-input-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .amount-preview {
      margin-top: 6px;
      font-size: 12px;
      color: var(--accent-2);
      font-weight: 600;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 6px;
    }

    .chip {
      padding: 6px 11px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      color: var(--text-2);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .chip.active {
      background: var(--accent-grad);
      border-color: transparent;
      color: #ffffff;
    }

    /* Plus Menu Grid */
    .plus-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .plus-card {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.16s var(--ease-spring);
    }

    .plus-card:active { transform: scale(0.97); }

    .plus-card h3 {
      font-size: 15px;
      font-weight: 700;
    }

    .plus-card p {
      font-size: 12px;
      color: var(--text-3);
    }

    /* Bonus 6 squares */
    .bonus-6 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .bonus-sq {
      padding: 14px 8px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      text-align: center;
    }

    /* Calculator */
    .calc-display {
      padding: 16px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255,255,255,0.12);
      text-align: right;
      margin-bottom: 12px;
    }

    .calc-expr {
      font-size: 13px;
      color: var(--text-3);
      min-height: 18px;
    }

    .calc-val {
      font-size: 30px;
      font-weight: 760;
      letter-spacing: -0.02em;
      word-break: break-all;
    }

    .calc-conv {
      font-size: 13px;
      color: var(--accent-2);
      margin-top: 4px;
      font-weight: 600;
    }

    .calc-pad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
    }

    .calc-key {
      height: 52px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.07);
      color: var(--text-1);
      font-size: 18px;
      font-weight: 650;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.1s ease, background 0.15s ease;
    }

    .calc-key:active { transform: scale(0.94); background: rgba(255,255,255,0.16); }
    .calc-key.op { color: var(--accent-2); background: rgba(255,255,255,0.10); }
    .calc-key.eq { background: var(--accent-grad); color: #fff; border-color: transparent; }

    /* PDF Preview 2 Pages */
    .pdf-page-preview {
      background: #ffffff;
      color: #0f172a;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.4);
      font-size: 12px;
    }

    .pdf-page-preview h4 {
      color: #0f172a;
      font-size: 14px;
      border-bottom: 2px solid #3b82f6;
      padding-bottom: 6px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .pdf-kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .pdf-kpi {
      background: #f1f5f9;
      border-radius: 8px;
      padding: 8px;
    }

    /* Camera modal */
    .cam-video {
      width: 100%;
      border-radius: 18px;
      background: #000;
      max-height: 52vh;
      object-fit: cover;
    }

    /* Empty state */
    .empty-box {
      padding: 26px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: var(--text-3);
    }

    /* Toast */
    .toast {
      position: fixed;
      top: calc(var(--safe-top) + 14px);
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      z-index: 120;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(255,255,255,0.22);
      backdrop-filter: blur(18px);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s var(--ease-spring);
      box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Switch toggle */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
    }

    .switch {
      width: 48px;
      height: 28px;
      border-radius: 999px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.2);
      position: relative;
      cursor: pointer;
      transition: background 0.2s ease;
      flex-shrink: 0;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.22s var(--ease-spring);
    }

    .switch.on {
      background: var(--accent-grad);
      border-color: transparent;
    }

    .switch.on::after {
      transform: translateX(20px);
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

    /* ---------------- Formatting & Currency ---------------- */
    function getRate() {
      const r = Number(state.settings.rate);
      return r > 0 ? r : 22500;
    }

    function formatGroupedInt(n) {
      const sign = n < 0 ? "-" : "";
      const s = Math.abs(Math.round(n)).toString();
      return sign + s.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    function formatUsd(usd) {
      if (state.settings.hideBalances) return "•••• $";
      const val = Number(usd) || 0;
      const sign = val < 0 ? "-" : "";
      const abs = Math.abs(val);
      const rounded = Math.round(abs * 100) / 100;
      const intPart = Math.floor(rounded);
      const frac = Math.round((rounded - intPart) * 100);
      const grouped = intPart.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      if (frac === 0) return `${sign}${grouped} $`;
      return `${sign}${grouped},${String(frac).padStart(2, "0")} $`;
    }

    function formatCdf(usd) {
      if (state.settings.hideBalances) return "•••• CDF";
      const cdf = (Number(usd) || 0) * getRate();
      return `${formatGroupedInt(cdf)} CDF`;
    }

    function formatMoney(usd, curr = state.settings.displayCurrency) {
      return curr === "CDF" ? formatCdf(usd) : formatUsd(usd);
    }

    function formatOther(usd, curr = state.settings.displayCurrency) {
      return curr === "CDF" ? formatUsd(usd) : formatCdf(usd);
    }

    function moneyBlockHtml(usd, curr = state.settings.displayCurrency) {
      return `
        <div class="row-amount tabular">${formatMoney(usd, curr)}</div>
        <div class="row-eq tabular">${formatOther(usd, curr)}</div>
      `;

    function esc(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    /* ---------------- Calculations ---------------- */
    function sumUsd(arr, key = "amountUsd") {
      return arr.reduce((acc, it) => acc + (Number(it[key]) || 0), 0);
    }

    function computeMetrics() {
      const includedAccounts = sumUsd(state.accounts.filter(a => !a.hidden), "balanceUsd");
      const hiddenAccounts = sumUsd(state.accounts.filter(a => !!a.hidden), "balanceUsd");
      const totalRemun = sumUsd(state.remunerations);
      const totalBonus = sumUsd(state.bonuses);
      const totalExpenses = sumUsd(state.expenses);
      const totalSavings = sumUsd(state.savings);
      const totalInvestments = sumUsd(state.investments);

      // Formule exacte : comptes inclus + rémunération + bonus − dépenses
      const soldeGeneral = includedAccounts + totalRemun + totalBonus - totalExpenses;
      // Valeur totale inclut aussi comptes cachés + épargne + investissement
      const valeurTotale = soldeGeneral + hiddenAccounts + totalSavings + totalInvestments;

      const autoOtherIncome = totalBonus + totalRemun;
      const otherIncome = state.settings.otherIncomeOverrideUsd !== null && state.settings.otherIncomeOverrideUsd !== undefined
        ? Number(state.settings.otherIncomeOverrideUsd)
        : autoOtherIncome;

      const now = new Date();
      const monthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
      const monthExpenses = sumUsd(state.expenses.filter(e => (e.date || "").startsWith(monthKey)));
      const monthRemun = sumUsd(state.remunerations.filter(r => (r.date || "").startsWith(monthKey)));
      const monthBonus = sumUsd(state.bonuses.filter(b => (b.date || "").startsWith(monthKey)));
      const monthSavings = sumUsd(state.savings.filter(s => (s.date || "").startsWith(monthKey)));

      return {
        includedAccounts,
        hiddenAccounts,
        totalRemun,
        totalBonus,
        totalExpenses,
        totalSavings,
        totalInvestments,
        soldeGeneral,
        valeurTotale,
        autoOtherIncome,
        otherIncome,
        monthExpenses,
        monthRemun,
        monthBonus,
        monthSavings
      };
    }

      return `<div class="icon-squircle ${size}">${iconSvg(name)}</div>`;
    }

    function gaugeSvg(pct, size = 44, stroke = 4) {
      const clamped = Math.max(0, Math.min(100, Math.round(pct)));
      const r = (size - stroke * 2) / 2;
      const c = 2 * Math.PI * r;
      const offset = c - (clamped / 100) * c;
      return `
        <div class="ring-wrap" style="width:${size}px;height:${size}px">
          <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
            <circle class="ring-track" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}" />
            <circle class="ring-fill" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"
              stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}" data-target-offset="${offset.toFixed(2)}" />
          </svg>
          <span class="ring-pct tabular">${clamped}%</span>
        </div>
      `;
    }

    /* ---------------- Count-Up Animation ---------------- */
    function animateValue(el, start, end, formatter) {
      if (!el) return;
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        el.textContent = formatter(end);
        return;
      }
      const duration = 520;
      const t0 = performance.now();
      function frame(now) {
        const p = Math.min(1, (now - t0) / duration);
        const eased = 1 - Math.pow(1 - p, 3);
        const cur = start + (end - start) * eased;
        el.textContent = formatter(cur);
        if (p < 1) requestAnimationFrame(frame);
        else el.textContent = formatter(end);
      }
      requestAnimationFrame(frame);
    }

    /* ---------------- Tab Navigation ---------------- */
    function switchTab(tab) {
      if (!TAB_ORDER.includes(tab)) return;
      if (tab === currentTab && !(tab === "plus" && plusSubView !== null)) return;
      const oldIdx = TAB_ORDER.indexOf(currentTab);
      const newIdx = TAB_ORDER.indexOf(tab);
      const forward = newIdx >= oldIdx;

      TAB_ORDER.forEach(t => {
        const page = document.getElementById("page-" + t);
        page.classList.remove("active", "exit-left", "exit-right");
        if (t === currentTab && t !== tab) {
          page.classList.add(forward ? "exit-left" : "exit-right");
        }
      });

      const target = document.getElementById("page-" + tab);
      target.classList.remove("exit-left", "exit-right");
      target.classList.add("active");

      currentTab = tab;
      if (tab !== "plus") plusSubView = null;

      document.querySelectorAll(".nav-item").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === tab);
      });
      renderCurrentPage();
    }

      else if (currentTab === "caisse") renderCaisse();
      else if (currentTab === "objets") renderObjets();
      else if (currentTab === "plus") renderPlus();

    /* ---------------- ACCUEIL ---------------- */
    function buildSparklineSvg(m) {
      const pts = [
        Math.max(0, m.includedAccounts * 0.4),
        Math.max(0, m.includedAccounts + m.totalRemun * 0.5),
        Math.max(0, m.includedAccounts + m.totalRemun + m.totalBonus - m.totalExpenses * 0.6),
        Math.max(0, m.soldeGeneral),
        Math.max(0, m.soldeGeneral + m.totalSavings * 0.6),
        Math.max(0, m.valeurTotale)
      ];
      const max = Math.max(1, ...pts);
      const min = Math.min(0, ...pts);
      const span = Math.max(1, max - min);
      const w = 112, h = 34, pad = 4;
      const coords = pts.map((v, i) => {
        const x = pad + (i / (pts.length - 1)) * (w - pad * 2);
        const y = h - pad - ((v - min) / span) * (h - pad * 2);
        return [x.toFixed(1), y.toFixed(1)];
      });
      const d = coords.map((c, i) => (i === 0 ? `M${c[0]},${c[1]}` : `L${c[0]},${c[1]}`)).join(" ");
      const last = coords[coords.length - 1];
      return `
        <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true" style="flex-shrink:0">
          <path d="${d}" fill="none" stroke="url(#accentGradDef)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="var(--accent-2)" />
        </svg>
      `;
    }

    function renderAccueil() {
      const m = computeMetrics();
      const curr = state.settings.displayCurrency;
      const page = document.getElementById("page-accueil");

      // Top 3 most advanced goals
      const rankedGoals = [...state.goals]
        .map(g => ({ ...g, pct: g.targetUsd > 0 ? Math.min(100, (g.savedUsd / g.targetUsd) * 100) : 0 }))
        .sort((a, b) => b.pct - a.pct)
        .slice(0, 3);

      // Closest upcoming deadline goal
      const nowMs = Date.now();
      const upcomingGoals = state.goals
        .filter(g => g.deadline && new Date(g.deadline + "T23:59:59").getTime() > nowMs && (g.savedUsd < g.targetUsd))
        .sort((a, b) => new Date(a.deadline).getTime() - new Date(b.deadline).getTime());
      const nearestGoal = upcomingGoals[0] || null;

      // Flow bar proportions
      const flowBase = Math.max(1, Math.abs(m.includedAccounts + m.totalRemun + m.totalBonus) + m.totalSavings + m.totalInvestments + m.totalExpenses);
      const pSav = Math.round(((m.totalSavings + m.totalInvestments) / flowBase) * 100);
      const pExp = Math.round((m.totalExpenses / flowBase) * 100);
      const pAvail = Math.max(0, 100 - pSav - pExp);

      // Active items for bottom strip
      const activeItems = state.items.filter(it => !it.purchased);

      page.innerHTML = `
        <!-- Balance Card: strictly big balance, $ | CDF top right, conversion + rate line underneath -->
        <div class="card balance-card">

    function bindAccueilEvents(page) {
      page.querySelectorAll("[data-set-curr]").forEach(btn => {
        btn.addEventListener("click", () => {
          state.settings.displayCurrency = btn.dataset.setCurr;
          saveState();
          renderAccueil();
        });
      });

      page.querySelectorAll("[data-open-goal]").forEach(el => {
        el.addEventListener("click", () => {
          const g = state.goals.find(x => x.id === el.dataset.openGoal);
          if (g) openGoalForm(g);
        });
      });

      const salCard = page.querySelector("#card-monthly-salary");
      if (salCard) salCard.addEventListener("click", openMonthlySalaryModal);

      const otherCard = page.querySelector("#card-other-income");
      if (otherCard) otherCard.addEventListener("click", openOtherIncomeModal);

      page.querySelectorAll("[data-qa]").forEach(el => {
        el.addEventListener("click", () => handleQuickAction(el.dataset.qa));
      });

      page.querySelectorAll("[data-go-tab]").forEach(el => {
        el.addEventListener("click", () => switchTab(el.dataset.goTab));
      });

      const editBtn = page.querySelector("#btn-toggle-widget-edit");
      if (editBtn) editBtn.addEventListener("click", () => {
        widgetEditMode = !widgetEditMode;
        renderAccueil();
      });

      const addWBtn = page.querySelector("#btn-add-widget");
      if (addWBtn) addWBtn.addEventListener("click", openAddWidgetModal);

      page.querySelectorAll("[data-w-resize]").forEach(btn => {
        btn.addEventListener("click", () => {
          const w = state.widgets.find(x => x.id === btn.dataset.wResize);
          if (!w) return;
          const order = ["square", "wide", "large"];
          w.size = order[(order.indexOf(w.size) + 1) % order.length];
          saveState();
          renderAccueil();
        });
      });

      page.querySelectorAll("[data-w-del]").forEach(btn => {
        btn.addEventListener("click", () => {
          state.widgets = state.widgets.filter(x => x.id !== btn.dataset.wDel);
          saveState();
          renderAccueil();
        });
      });

      page.querySelectorAll("[data-toggle-task]").forEach(cb => {
        cb.addEventListener("change", () => {
          const t = state.tasks.find(x => x.id === cb.dataset.toggleTask);
          if (t) {
            t.done = cb.checked;
            saveState();
            renderAccueil();
          }
        });
      });

      page.querySelectorAll("[data-widget-note]").forEach(ta => {
        ta.addEventListener("input", () => {
          state.settings.quickNote = ta.value;
          saveState();
        });
      });

      page.querySelectorAll("[data-rate-conv-usd]").forEach(inp => {
        const wid = inp.dataset.rateConvUsd;
        const cdfInp = page.querySelector(`[data-rate-conv-cdf="${wid}"]`);
        inp.addEventListener("input", () => {
          const v = parseFloat(inp.value) || 0;
          if (cdfInp) cdfInp.value = Math.round(v * getRate());
        });
        if (cdfInp) {
          cdfInp.addEventListener("input", () => {
            const v = parseFloat(cdfInp.value) || 0;
            inp.value = (v / getRate()).toFixed(2);
          });
        }
      });

      page.querySelectorAll("[data-pin-item]").forEach(btn => {
        btn.addEventListener("click", () => togglePinItemWidget(btn.dataset.pinItem));
      });

      page.querySelectorAll("[data-contrib-item]").forEach(btn => {
        btn.addEventListener("click", () => {
          const it = state.items.find(x => x.id === btn.dataset.contribItem);
          if (it) openItemContributeModal(it);
        });
      });
    }

    function formatCountdown(deadlineStr) {
      if (!deadlineStr) return "--j --h --m --s";
      const target = new Date(deadlineStr + "T23:59:59").getTime();
      const diff = Math.max(0, target - Date.now());
      const sec = Math.floor(diff / 1000);
      const d = Math.floor(sec / 86400);
      const h = Math.floor((sec % 86400) / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return `${d}j ${String(h).padStart(2, "0")}h ${String(m).padStart(2, "0")}m ${String(s).padStart(2, "0")}s`;
    }

    function startCountdownLoop() {
      clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        const el = document.getElementById("live-countdown");
        if (!el) return;
        const dl = el.dataset.deadline;
        if (dl) el.textContent = formatCountdown(dl);
      }, 1000);
    }

    function recommendedMonthsForPrice(priceUsd) {
      if (priceUsd <= 150) return 3;
      if (priceUsd <= 600) return 6;
      if (priceUsd <= 2000) return 12;
      return 24;
    }

            const pct = it.priceUsd > 0 ? Math.min(100, (it.savedUsd / it.priceUsd) * 100) : 0;

    /* PLUS: CALCULATRICE */
    let calcExpr = "0";
    let calcMode = "USD"; // USD -> CDF or CDF -> USD

    function renderPlusCalculatrice(page) {
      let val = 0;
      try {
        const sanitized = calcExpr.replace(/[^0-9+\-*/.()]/g, "");
        val = sanitized ? Function('"use strict";return (' + sanitized + ')')() : 0;
        if (!isFinite(val)) val = 0;
      } catch (e) {
        val = 0;
      }
      const converted = calcMode === "USD"
        ? `${formatGroupedInt(val * getRate())} CDF`
        : `${formatUsd(val / getRate())}`;

      page.innerHTML = `
        ${subViewHeader("Calculatrice & Conversion")}
        <div class="card" style="padding:16px">

          </div>
        </div>
      `;

      page.querySelectorAll("[data-cmode]").forEach(b => {
        b.addEventListener("click", () => { calcMode = b.dataset.cmode; renderPlusCalculatrice(page); });
      });
      page.querySelectorAll("[data-ck]").forEach(b => {
        b.addEventListener("click", () => {
          const k = b.dataset.ck;
          if (k === "C") calcExpr = "0";
          else if (k === "DEL") calcExpr = calcExpr.length > 1 ? calcExpr.slice(0, -1) : "0";
          else if (k === "%") {
            try {
              const v = Function('"use strict";return (' + calcExpr.replace(/[^0-9+\-*/.()]/g, "") + ')')();
              calcExpr = String((Number(v) || 0) / 100);
            } catch (e) {}
          } else if (k === "=") {
            try {
              const v = Function('"use strict";return (' + calcExpr.replace(/[^0-9+\-*/.()]/g, "") + ')')();
              calcExpr = isFinite(v) ? String(Math.round(v * 10000) / 10000) : "0";
            } catch (e) { calcExpr = "0"; }
          } else {
            calcExpr = calcExpr === "0" && k !== "." ? k : calcExpr + k;
          }
          renderPlusCalculatrice(page);
        });
      });
    }

    function buildReportData() {
      const m = computeMetrics();
      const sal = Number(state.settings.monthlySalaryUsd) || 0;
      const totalIncomeMonth = sal + m.monthRemun + m.monthBonus;
      const savingsRate = totalIncomeMonth > 0 ? Math.round(((m.monthSavings + m.totalInvestments) / totalIncomeMonth) * 100) : 0;
      const lateDebts = state.debts.filter(d => d.status === "en_cours" && d.dueDate && d.dueDate < todayISO());

      let health = "Équilibré";
      if (m.soldeGeneral < 0 || lateDebts.length > 0) health = "Vigilance requise";
      else if (savingsRate >= 20 && m.totalSavings > 0) health = "Excellent";

      const recs = [];
      if (lateDebts.length > 0) recs.push(`Régulariser ${lateDebts.length} dette(s) en retard en priorité.`);
      if (sal > 0 && m.monthExpenses > sal * 0.7) recs.push("Vos dépenses du mois dépassent 70% du salaire : réduisez les postes non essentiels.");
      if (m.totalSavings <= 0) recs.push("Constituez un matelas d'épargne d'urgence (objectif conseillé : 15% du revenu).");
      if (state.goals.length === 0) recs.push("Définissez au moins un objectif daté pour piloter votre effort quotidien.");
      if (recs.length === 0) recs.push("Situation saine : maintenez votre rythme d'épargne et diversifiez vos investissements.");

      return { m, sal, totalIncomeMonth, savingsRate, lateDebts, health, recs };
    }

    function loadJsPdfOnDemand() {
      return new Promise((resolve) => {
        if (window.jspdf && window.jspdf.jsPDF) return resolve(true);
        if (typeof navigator !== "undefined" && navigator.onLine === false) return resolve(false);
        const s = document.createElement("script");
        let done = false;
        const finish = (ok) => { if (!done) { done = true; resolve(ok); } };
        const timer = setTimeout(() => finish(false), 2800);
        s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
        s.onload = () => { clearTimeout(timer); finish(!!(window.jspdf && window.jspdf.jsPDF)); };
        s.onerror = () => { clearTimeout(timer); finish(false); };
        document.head.appendChild(s);
      });
    }

    async function generateTwoPagePdf() {

      doc.setFontSize(14);

      y += 6;

      r.recs.forEach(rec => {

      const filename = `rapport-epargne-${todayISO()}.pdf`;
      if (window.AndroidBridge && window.AndroidBridge.savePdfBase64) {
        const dataUri = doc.output("datauristring");
        const b64 = dataUri.split(",")[1];
        window.AndroidBridge.savePdfBase64(filename, b64);
        showToast("Rapport PDF généré !");
      } else {

        showToast("Rapport PDF téléchargé !");

    }

    function bindAmountBox(id) {
      const box = sheetEl.querySelector(`[data-amt-box="${id}"]`);
      if (!box) return () => 0;
      const inp = box.querySelector(`#${id}`);
      const prev = box.querySelector(`#${id}-preview`);

      function updatePreview() {
        const curr = box.dataset.amtCurr;
        const v = parseFloat(inp.value) || 0;
        const usd = curr === "CDF" ? v / getRate() : v;
        prev.textContent = curr === "CDF"
          ? `Équivalent : ${formatUsd(usd)}`
          : `Équivalent : ${formatCdf(usd)}`;
      }

      box.querySelectorAll("[data-amt-sw]").forEach(btn => {
        btn.addEventListener("click", () => {
          const oldCurr = box.dataset.amtCurr;
          const newCurr = btn.dataset.amtSw;
          if (oldCurr === newCurr) return;
          const raw = parseFloat(inp.value);
          if (!isNaN(raw) && raw > 0) {
            const usd = oldCurr === "CDF" ? raw / getRate() : raw;
            inp.value = newCurr === "CDF" ? Math.round(usd * getRate()) : (Math.round(usd * 100) / 100);
          }
          box.dataset.amtCurr = newCurr;
          box.querySelectorAll("[data-amt-sw]").forEach(b => b.classList.toggle("active", b.dataset.amtSw === newCurr));
          updatePreview();
        });
      });

      inp.addEventListener("input", updatePreview);
      updatePreview();

      return () => {
        const v = parseFloat(inp.value) || 0;
        return box.dataset.amtCurr === "CDF" ? v / getRate() : v;
      };
    }

    /* ---------------- Photo Capture (Gallery + getUserMedia with fallback) ---------------- */
    function compressDataUrl(fileOrBlob, cb) {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const max = 420;
          let w = img.width, h = img.height;
          if (w > h && w > max) { h = Math.round(h * max / w); w = max; }
          else if (h >= w && h > max) { w = Math.round(w * max / h); h = max; }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          cb(canvas.toDataURL("image/jpeg", 0.76));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(fileOrBlob);
    }

    function pickPhotoFromGallery(onDone) {
      const inp = document.getElementById("hidden-file-gallery");
      inp.value = "";
      inp.onchange = () => {
        if (inp.files && inp.files[0]) compressDataUrl(inp.files[0], onDone);
      };
      inp.click();
    }

    function fallbackCameraInput(onDone) {
      const inp = document.getElementById("hidden-file-camera");
      inp.value = "";
      inp.onchange = () => {
        if (inp.files && inp.files[0]) compressDataUrl(inp.files[0], onDone);
      };
      inp.click();
    }

    function stopCameraStream() {
      if (activeCamStream) {
        activeCamStream.getTracks().forEach(t => t.stop());
        activeCamStream = null;
      }
    }

    function capturePhotoWithCamera(onDone, reopenParent) {
      if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
        fallbackCameraInput(onDone);
        return;
      }
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
        .then(stream => {
          activeCamStream = stream;
          openSheet(`
            <div class="sheet-head">
              <div class="sheet-title">Appareil photo</div>
              <button class="glass-btn" id="cam-cancel">Annuler</button>
            </div>
            <video class="cam-video" id="cam-video" autoplay playsinline></video>
            <button class="primary-btn" style="width:100%;margin-top:12px" id="cam-snap">${iconSvg("camera")} Prendre la photo</button>
          `);
          const vid = sheetEl.querySelector("#cam-video");
          vid.srcObject = stream;
          sheetEl.querySelector("#cam-cancel").addEventListener("click", () => {
            stopCameraStream();
            reopenParent();
          });
          sheetEl.querySelector("#cam-snap").addEventListener("click", () => {
            const canvas = document.createElement("canvas");
            const max = 420;
            const vw = vid.videoWidth || 640, vh = vid.videoHeight || 480;
            const scale = Math.min(1, max / Math.max(vw, vh));
            canvas.width = Math.round(vw * scale);
            canvas.height = Math.round(vh * scale);
            canvas.getContext("2d").drawImage(vid, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL("image/jpeg", 0.78);
            stopCameraStream();
            onDone(dataUrl);
          });
        })
        .catch(() => {
          fallbackCameraInput(onDone);
        });
    }

        closeSheet();
        renderAll();
        showToast("Objet enregistré");
      });
    }

    function openItemContributeModal(item) {
      openSheet(`
        <div class="sheet-head">
          <div class="sheet-title">Cotiser pour « ${esc(item.name)} »</div>
          <button class="glass-btn" id="sh-close">Fermer</button>
        </div>
        ${amountFieldHtml("cot-amt", "Montant à cotiser", 10)}
        <button class="primary-btn" style="width:100%" id="cot-ok">Valider la cotisation</button>
      `);
      const getVal = bindAmountBox("cot-amt");
      sheetEl.querySelector("#sh-close").addEventListener("click", closeSheet);
      sheetEl.querySelector("#cot-ok").addEventListener("click", () => {
        item.savedUsd = (Number(item.savedUsd) || 0) + Math.max(0, getVal());
        saveState();
        closeSheet();
        renderAll();
        showToast("Cotisation ajoutée !");
      });
    }

    function confirmPurchaseItem(item) {
      openSheet(`
        <div class="sheet-head">
          <div class="sheet-title">Confirmer l'achat</div>
          <button class="glass-btn" id="sh-close">Annuler</button>
        </div>
        <p style="color:var(--text-2);margin-bottom:16px">
          Marquer « <strong>${esc(item.name)}</strong> » comme acheté et le déplacer dans « Objets achetés » ?
        </p>
        <div style="display:flex;gap:10px">
          <button class="glass-btn" style="flex:1" id="buy-no">Annuler</button>
          <button class="primary-btn" style="flex:1" id="buy-yes">Confirmer ✓</button>
        </div>
      `);
      sheetEl.querySelector("#sh-close").addEventListener("click", closeSheet);
      sheetEl.querySelector("#buy-no").addEventListener("click", closeSheet);
      sheetEl.querySelector("#buy-yes").addEventListener("click", () => {
        item.purchased = true;
        item.purchasedDate = todayISO();
        saveState();
        closeSheet();
        renderAll();
        showToast("Félicitations ! Objet marqué acheté.");
      });
    }

    /* BONUS & DETTES & TACHES & WIDGETS */
    function openBonusForm(existing, defaultCat = "cadeau") {
      let selCat = existing ? existing.category : defaultCat;
      openSheet(`
        <div class="sheet-head">
          <div class="sheet-title">${existing ? "Modifier le bonus" : "Ajouter un bonus"}</div>
          <button class="glass-btn" id="sh-close">Fermer</button>
        </div>
        <div class="field">
          <label>Catégorie</label>
          <div class="chips-row">
            ${BONUS_TYPES.map(b => `<button type="button" class="chip ${selCat === b.id ? "active" : ""}" data-bcat="${b.id}">${b.label}</button>`).join("")}
          </div>
        </div>
        <div class="field">
          <label>Titre / Description</label>
          <input class="input" id="b-title" placeholder="Ex: Prime trimestrielle..." value="${esc(existing ? existing.title : "")}" />
        </div>
        ${amountFieldHtml("b-amt", "Montant du bonus", existing ? existing.amountUsd : 0)}
        <div class="field">
          <label>Date</label>
          <input class="input" type="date" id="b-date" value="${esc(existing && existing.date ? existing.date : todayISO())}" />
        </div>
        <div style="display:flex;gap:8px">
          ${existing ? `<button class="danger-btn" id="b-del">${iconSvg("trash")} Supprimer</button>` : ""}
          <button class="primary-btn" style="flex:1" id="b-save">Enregistrer</button>
        </div>
      `);
      const getAmt = bindAmountBox("b-amt");
      sheetEl.querySelector("#sh-close").addEventListener("click", closeSheet);
      sheetEl.querySelectorAll("[data-bcat]").forEach(c => {
        c.addEventListener("click", () => {
          selCat = c.dataset.bcat;
          sheetEl.querySelectorAll("[data-bcat]").forEach(x => x.classList.toggle("active", x.dataset.bcat === selCat));
        });
      });
      if (existing) {
        sheetEl.querySelector("#b-del").addEventListener("click", () => {
          state.bonuses = state.bonuses.filter(x => x.id !== existing.id);
          saveState();
          closeSheet();
          renderAll();
          showToast("Bonus supprimé");
        });
      }
      sheetEl.querySelector("#b-save").addEventListener("click", () => {
        const bt = BONUS_TYPES.find(x => x.id === selCat) || BONUS_TYPES[0];
        const title = sheetEl.querySelector("#b-title").value.trim() || bt.label;
        const amountUsd = Math.max(0, getAmt());
        const date = sheetEl.querySelector("#b-date").value || todayISO();
        if (existing) Object.assign(existing, { category: selCat, title, amountUsd, date });
        else state.bonuses.unshift({ id: uid(), category: selCat, title, amountUsd, date });
        saveState();
        closeSheet();
        renderAll();
        showToast("Bonus enregistré");
      });
    }

    function openDebtForm(existing) {
      let status = existing ? existing.status : "en_cours";
      openSheet(`
        <div class="sheet-head">
          <div class="sheet-title">${existing ? "Modifier la dette" : "Nouvelle dette"}</div>
          <button class="glass-btn" id="sh-close">Fermer</button>
        </div>
        <div class="field">
          <label>Nom / Créancier</label>
          <input class="input" id="d-name" placeholder="Ex: Prêt bancaire, Marc..." value="${esc(existing ? existing.name : "")}" />
        </div>
        ${amountFieldHtml("d-amt", "Somme", existing ? existing.amountUsd : 0)}
        <div class="field">
          <label>Date de remboursement</label>
          <input class="input" type="date" id="d-date" value="${esc(existing && existing.dueDate ? existing.dueDate : todayISO())}" />
        </div>
        <div class="field">
          <label>État</label>
          <div class="chips-row">
            <button type="button" class="chip ${status === "en_cours" ? "active" : ""}" data-dst="en_cours">En cours</button>
            <button type="button" class="chip ${status === "en_pause" ? "active" : ""}" data-dst="en_pause">En pause</button>
            <button type="button" class="chip ${status === "valide" ? "active" : ""}" data-dst="valide">Validé</button>
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:8px">
          ${existing ? `<button class="danger-btn" id="d-del">${iconSvg("trash")} Supprimer</button>` : ""}
          <button class="primary-btn" style="flex:1" id="d-save">Enregistrer</button>
        </div>
      `);
      const getAmt = bindAmountBox("d-amt");
      sheetEl.querySelector("#sh-close").addEventListener("click", closeSheet);
      sheetEl.querySelectorAll("[data-dst]").forEach(c => {
        c.addEventListener("click", () => {
          status = c.dataset.dst;
          sheetEl.querySelectorAll("[data-dst]").forEach(x => x.classList.toggle("active", x.dataset.dst === status));
        });
      });
      if (existing) {
        sheetEl.querySelector("#d-del").addEventListener("click", () => {
          state.debts = state.debts.filter(x => x.id !== existing.id);
          saveState();
          closeSheet();
          renderAll();
          showToast("Dette supprimée");
        });
      }
      sheetEl.querySelector("#d-save").addEventListener("click", () => {
        const name = sheetEl.querySelector("#d-name").value.trim() || "Dette";
        const amountUsd = Math.max(0, getAmt());
        const dueDate = sheetEl.querySelector("#d-date").value || "";
        if (existing) Object.assign(existing, { name, amountUsd, dueDate, status });
        else state.debts.unshift({ id: uid(), name, amountUsd, dueDate, status });
        saveState();
        closeSheet();
        renderAll();
        showToast("Dette enregistrée");
      });
    }

    function openTaskForm() {
      openSheet(`
        <div class="sheet-head">
          <div class="sheet-title">Nouvelle tâche</div>
          <button class="glass-btn" id="sh-close">Fermer</button>
        </div>
        <div class="field">
          <label>Intitulé de la tâche</label>
          <input class="input" id="t-title" placeholder="Ex: Transférer épargne mensuelle..." />
        </div>
        <button class="primary-btn" style="width:100%" id="t-save">Ajouter la tâche</button>
      `);
      sheetEl.querySelector("#sh-close").addEventListener("click", closeSheet);
      sheetEl.querySelector("#t-save").addEventListener("click", () => {
        const title = sheetEl.querySelector("#t-title").value.trim();
        if (!title) return;
        state.tasks.unshift({ id: uid(), title, done: false, date: todayISO() });
        saveState();
        closeSheet();
        renderAll();
        showToast("Tâche ajoutée");
      });
    }

    function openAddWidgetModal() {
      let chosenSize = "square";
      openSheet(`
        <div class="sheet-head">
          <div class="sheet-title">Ajouter un widget</div>
          <button class="glass-btn" id="sh-close">Fermer</button>
        </div>
        <div class="field">
          <label>Taille du widget</label>
          <div class="chips-row">
            <button type="button" class="chip active" data-wsz="square">Carré (1×1)</button>
            <button type="button" class="chip" data-wsz="wide">Rectangle large (2×1)</button>
            <button type="button" class="chip" data-wsz="large">Grand carré (2×2)</button>
          </div>
        </div>
        <div class="qa-grid">
          ${WIDGET_CATALOG.map(wc => `
            <button class="qa-tile" data-wtype="${wc.type}">
              ${iconSquircle(wc.icon)}
              <span>${wc.title}</span>
            </button>
          `).join("")}
        </div>
      `);
      sheetEl.querySelector("#sh-close").addEventListener("click", closeSheet);
      sheetEl.querySelectorAll("[data-wsz]").forEach(b => {
        b.addEventListener("click", () => {
          chosenSize = b.dataset.wsz;
          sheetEl.querySelectorAll("[data-wsz]").forEach(x => x.classList.toggle("active", x.dataset.wsz === chosenSize));
        });
      });
      sheetEl.querySelectorAll("[data-wtype]").forEach(b => {
        b.addEventListener("click", () => {
          state.widgets.push({ id: uid(), type: b.dataset.wtype, size: chosenSize, refId: null });
          saveState();
          closeSheet();
          switchTab("accueil");
          showToast("Widget épinglé au tableau");
        });
      });
    }

    function togglePinGoalWidget(goalId) {
      const idx = state.widgets.findIndex(w => w.type === "objectif" && w.refId === goalId);
      if (idx >= 0) {
        state.widgets.splice(idx, 1);
        showToast("Objectif retiré du dashboard");
      } else {
        state.widgets.push({ id: uid(), type: "objectif", size: "square", refId: goalId });
        showToast("Objectif épinglé au dashboard");
      }
      saveState();
      renderCurrentPage();
    }

    function togglePinItemWidget(itemId) {
      const idx = state.widgets.findIndex(w => w.type === "objet" && w.refId === itemId);
      if (idx >= 0) {
        state.widgets.splice(idx, 1);
        showToast("Objet retiré du dashboard");
      } else {
        state.widgets.push({ id: uid(), type: "objet", size: "square", refId: itemId });
        showToast("Objet épinglé au dashboard");
      }
      saveState();
      renderCurrentPage();
    }

    /* ---------------- PARAMETRES ---------------- */
    function openSettingsModal() {
      const s = state.settings;
      openSheet(`
        <div class="sheet-head">
          <div class="sheet-title">Paramètres</div>
          <button class="glass-btn" id="sh-close">Fermer</button>
        </div>

        <div class="field">
          <label>Thème de l'interface</label>
          <div class="chips-row">
            <button type="button" class="chip ${s.theme === "blue" ? "active" : ""}" data-stheme="blue">Bleu nuit</button>
            <button type="button" class="chip ${s.theme === "orange" ? "active" : ""}" data-stheme="orange">Orange</button>
            <button type="button" class="chip ${s.theme === "green" ? "active" : ""}" data-stheme="green">Vert</button>
          </div>
        </div>

        <div class="field">
          <label>Style glass des icônes</label>
          <div class="chips-row">
            <button type="button" class="chip ${s.iconStyle === "glass" ? "active" : ""}" data-sicon="glass">Verre pur</button>
            <button type="button" class="chip ${s.iconStyle === "accent" ? "active" : ""}" data-sicon="accent">Accent thème</button>
            <button type="button" class="chip ${s.iconStyle === "silver" ? "active" : ""}" data-sicon="silver">Cristal argent</button>
            <button type="button" class="chip ${s.iconStyle === "frost" ? "active" : ""}" data-sicon="frost">Givre blanc</button>
          </div>
        </div>

        <div class="field">
          <label>Taux de change (1 $ = ... CDF)</label>
          <input class="input tabular" type="number" step="any" min="1" id="s-rate" value="${getRate()}" />
        </div>

        <div class="toggle-row">
          <div>
            <div style="font-size:13.5px;font-weight:600">Masquer les soldes</div>
            <div class="brand-sub">Affiche •••• à la place des montants</div>
          </div>
          <div class="switch ${s.hideBalances ? "on" : ""}" id="s-hide-sw"></div>
        </div>

        <div class="field" style="margin-top:8px">
          <label>Devise d'affichage principale</label>
          <div class="chips-row">
            <button type="button" class="chip ${s.displayCurrency === "USD" ? "active" : ""}" data-scurr="USD">$ Dollars</button>
            <button type="button" class="chip ${s.displayCurrency === "CDF" ? "active" : ""}" data-scurr="CDF">CDF Francs</button>
          </div>
        </div>

        <div style="display:flex;gap:10px;margin-top:16px">
          <button class="danger-btn" id="s-reset">Réinitialiser</button>
          <button class="primary-btn" style="flex:1" id="s-save">Appliquer</button>
        </div>
      `);

      sheetEl.querySelector("#sh-close").addEventListener("click", closeSheet);

      sheetEl.querySelectorAll("[data-stheme]").forEach(b => {
        b.addEventListener("click", () => {
          state.settings.theme = b.dataset.stheme;
          applyTheme();
          sheetEl.querySelectorAll("[data-stheme]").forEach(x => x.classList.toggle("active", x.dataset.stheme === state.settings.theme));
        });
      });

      sheetEl.querySelectorAll("[data-sicon]").forEach(b => {
        b.addEventListener("click", () => {
          state.settings.iconStyle = b.dataset.sicon;
          applyTheme();
          sheetEl.querySelectorAll("[data-sicon]").forEach(x => x.classList.toggle("active", x.dataset.sicon === state.settings.iconStyle));
        });
      });

      sheetEl.querySelectorAll("[data-scurr]").forEach(b => {
        b.addEventListener("click", () => {
          state.settings.displayCurrency = b.dataset.scurr;
          sheetEl.querySelectorAll("[data-scurr]").forEach(x => x.classList.toggle("active", x.dataset.scurr === state.settings.displayCurrency));
        });
      });

      const hideSw = sheetEl.querySelector("#s-hide-sw");
      hideSw.addEventListener("click", () => {
        state.settings.hideBalances = !state.settings.hideBalances;
        hideSw.classList.toggle("on", state.settings.hideBalances);
      });

      let resetConfirm = false;
      sheetEl.querySelector("#s-reset").addEventListener("click", (e) => {
        if (!resetConfirm) {
          resetConfirm = true;
          e.currentTarget.textContent = "Confirmer RAZ ?";
          return;
        }
        state = defaultState();
        saveState();
        closeSheet();
        renderAll();
        showToast("Application réinitialisée");
      });

      sheetEl.querySelector("#s-save").addEventListener("click", () => {
        const r = parseFloat(sheetEl.querySelector("#s-rate").value);
        if (r > 0) state.settings.rate = r;
        saveState();
        closeSheet();
        renderAll();
        showToast("Paramètres enregistrés");
      });
    }

    /* ---------------- Global Event Bindings ---------------- */
    document.querySelectorAll(".nav-item").forEach(btn => {
      btn.addEventListener("click", () => switchTab(btn.dataset.tab));
    });

    document.getElementById("fab-quick-add").addEventListener("click", openQuickAddSheet);
    document.getElementById("btn-top-settings").addEventListener("click", openSettingsModal);
    document.getElementById("btn-top-calc").addEventListener("click", () => {
      plusSubView = "calculatrice";
      switchTab("plus");
    });
    document.getElementById("btn-top-privacy").addEventListener("click", () => {
      state.settings.hideBalances = !state.settings.hideBalances;
      saveState();
      renderAll();
    });

    // Safe area injection bridge for Android WebView
    window.setSafeAreaInsets = function (topPx, bottomPx) {
      document.documentElement.style.setProperty("--safe-top", `${topPx}px`);
      document.documentElement.style.setProperty("--safe-bottom", `${bottomPx}px`);
    };

    // Android hardware Back button integration
    window.handleAndroidBack = function () {
      if (backdrop.classList.contains("open")) {
        closeSheet();
        return true;
      }
      if (currentTab === "plus" && plusSubView !== null) {
        plusSubView = null;
        renderPlus();
        return true;
      }
      if (currentTab !== "accueil") {
        switchTab("accueil");
        return true;
      }
      return false;
    };

    // Initial render
    const monthLabel = new Date().toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
    document.getElementById("header-subtitle").textContent = monthLabel.charAt(0).toUpperCase() + monthLabel.slice(1);
    renderAll();
  })();
  </script>
</body>
</html>
